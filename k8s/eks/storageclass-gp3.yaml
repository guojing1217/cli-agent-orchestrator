# gp3 StorageClass backed by the EBS CSI driver, marked cluster-default.
#
# WHY THIS IS REQUIRED, not a nicety: a fresh EKS 1.34 cluster ships exactly one
# StorageClass — `gp2`, on the legacy in-tree `kubernetes.io/aws-ebs`
# provisioner — and it is NOT annotated as the default. So a PVC that omits
# storageClassName resolves to no class at all and stays Pending forever, which
# surfaces only as pods stuck in Pending with no obvious cause.
#
#   kubectl apply -f k8s/eks/storageclass-gp3.yaml
#
# gp3 over gp2: better baseline throughput/IOPS at lower cost, and it runs on the
# CSI driver rather than the removed in-tree plugin.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
