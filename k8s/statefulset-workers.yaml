# StatefulSet for CAO worker nodes — ONE AGENT PER POD.
# Each pod runs a cao-server whose CAO_MAX_TERMINALS=1 caps it at exactly one
# live agent terminal. The single supervisor pod delegates work here via the
# assign/handoff `target_host` parameter, addressing workers by stable DNS:
#   cao-worker-{0..N-1}.cao-workers.cao-cluster.svc.cluster.local
# A worker whose one slot is taken rejects further placements with HTTP 429,
# so the supervisor can retry on the next worker.
#
# Why StatefulSet over Deployment:
#   - Sessions are pinned to the pod that created them (stable addressing)
#   - Predictable scale-down (highest ordinal first, supervisor can drain)
#   - Enumerable fleet for MCP config rendering
#   - Per-pod persistent state via volumeClaimTemplates (~/.cao survives restarts)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cao-worker
  namespace: cao-cluster
  labels:
    app.kubernetes.io/name: cao-worker
    app.kubernetes.io/part-of: cao-fleet
spec:
  serviceName: cao-workers
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cao-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cao-worker
        app.kubernetes.io/part-of: cao-fleet
    spec:
      # The image runs as uid/gid 1000 (user `cao`) but a freshly provisioned EBS
      # volume mounts root:root 0755, so the agent cannot write its own state
      # directory. fsGroup makes the volume group-owned by 1000 and setgid, which
      # is what actually lets CAO_HOME_DIR (=/home/cao/.cao) be written.
      securityContext:
        fsGroup: 1000
      # Force every worker onto a node that is NOT running the supervisor, so
      # each `target_host` delegation is a genuine cross-node hop rather than a
      # same-node one that would pass even if peer routing were broken.
      # Apply the supervisor first and wait for it to be Ready: this rule is
      # evaluated when a worker is scheduled, so with no supervisor pod running
      # yet the workers are unconstrained and may co-locate with it.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cao-supervisor
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cao-node
          image: 831932040055.dkr.ecr.us-east-1.amazonaws.com/cao-node:latest
          ports:
            - containerPort: 9889
              name: http
          env:
            - name: CAO_BIND_HOST
              value: "0.0.0.0"
            - name: CAO_API_PORT
              value: "9889"
            # Each pod must accept requests addressed to its own DNS name.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CAO_ALLOWED_HOSTS
              value: "$(POD_NAME).cao-workers,$(POD_NAME).cao-workers.cao-cluster.svc.cluster.local,localhost"
            # One agent per pod: reject a second terminal placement (HTTP 429)
            # instead of oversubscribing the pod's CPU/memory.
            # Notes on the cap:
            #   - It counts EVERY live terminal, including one stuck in ERROR:
            #     a crashed agent keeps occupying the pod's only slot until the
            #     supervisor frees it with
            #     delete_terminal(<id>, target_host=<this pod>).
            #   - It also blocks the optional memory_manager sidecar terminal
            #     (memory_manager=true session flag), so cross-session memory
            #     curation is effectively disabled on worker pods.
            - name: CAO_MAX_TERMINALS
              value: "1"
            # Worker profile installed on startup. mock_cli is the
            # credentials-free smoke-test default baked into the image; swap
            # in a real provider CLI for actual work, e.g.:
            #   value: "developer:claude_code"
            # (the image must have that provider CLI installed/authenticated,
            # and the worker egress NetworkPolicy must allow its API endpoints).
            - name: CAO_INSTALL_PROFILES
              value: "developer:mock_cli"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 9889
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9889
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            # Matches the image's CAO_HOME_DIR, which is what makes this mount
            # hold real state rather than just a lost+found.
            - name: cao-state
              mountPath: /home/cao/.cao
  # Per-pod persistent state (SQLite DB, logs, installed profiles). A PVC per
  # ordinal survives pod restarts/rescheduling, unlike the emptyDir it replaces.
  volumeClaimTemplates:
    - metadata:
        name: cao-state
        labels:
          app.kubernetes.io/part-of: cao-fleet
      spec:
        accessModes: ["ReadWriteOnce"]
        # Named explicitly rather than relying on the cluster default: on EKS the
        # in-tree `gp2` class is still the default on older clusters, and an
        # unset storageClassName on a cluster with no default at all leaves every
        # PVC Pending with no obvious cause.
        storageClassName: gp3
        resources:
          requests:
            storage: 1Gi
